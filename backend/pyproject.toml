[project]
name = "merito-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6", "alembic==1.20.0", "httpx==0.28.1", "beautifulsoup4==4.15.0", "pydantic-settings==2.15.0"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
